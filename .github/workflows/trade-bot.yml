name: Trade Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: trade-bot-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trade-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests lxml
      - run: python trade_bot.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trade-report
          path: |
            report_v4.json
            paper_state_v4.json
          if-no-files-found: warn
      - name: Save state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state_v4.json report_v4.json
          if ! git diff --cached --quiet; then
            git commit -m "Update V4 paper trading state"
            git push
          fi
